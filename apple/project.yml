# Xcode 工程唯一来源。改完执行 `./build.sh xcode` 重新生成 BillLensApple.xcodeproj。
# Info.plist 与 entitlements 以 Sources/ 下的文件为准，xcodegen 不改写它们。
name: BillLensApple
options:
  bundleIdPrefix: com.shendongchun
  developmentLanguage: en
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    DEVELOPMENT_TEAM: YH6JCRN97J
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

# 显式命名 scheme，避免与 SwiftPM 自动生成的 BillLensMacApp 可执行产品 scheme 重名。
schemes:
  BillLens-macOS:
    build:
      targets:
        BillLensMacApp: all
    run:
      config: Debug
    archive:
      config: Release
  BillLens-iOS:
    build:
      targets:
        BillLensIOSApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BillLensIOSUITests
    archive:
      config: Release

packages:
  BillLensApple:
    path: .

targets:

  BillLensIOSApp:
    productName: Billumi
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BillLensIOSApp
        excludes:
          - Info.plist
          - BillLensIOSApp.entitlements
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.BillLensApple
        PRODUCT_NAME: Billumi
        INFOPLIST_FILE: Sources/BillLensIOSApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      configs:
        Debug:
          BILLLENS_CLOUDKIT_ENABLED: NO
          CODE_SIGN_ENTITLEMENTS: ""
          OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -L$(SRCROOT)/../rust/target/aarch64-apple-ios/debug -lbilllens_ffi"
          OTHER_LDFLAGS[sdk=iphonesimulator*]: "$(inherited) -L$(SRCROOT)/../rust/target/aarch64-apple-ios-sim/debug -lbilllens_ffi"
        Release:
          BILLLENS_CLOUDKIT_ENABLED: YES
          CODE_SIGN_ENTITLEMENTS: Sources/BillLensIOSApp/BillLensIOSApp.entitlements
          OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -L$(SRCROOT)/../rust/target/aarch64-apple-ios/release -lbilllens_ffi"
          OTHER_LDFLAGS[sdk=iphonesimulator*]: "$(inherited) -L$(SRCROOT)/../rust/target/aarch64-apple-ios-sim/release -lbilllens_ffi"
    dependencies:
      - package: BillLensApple
        product: BillLensShared
      - package: BillLensApple
        product: BillLensAppleServices
      - target: BillLensShareExtension
        embed: true

  # 分享扩展只把账单文件写入 App Group 收件箱，不链接 Rust 与 Swift 包，保持体积和内存最小。
  # App Group 仅在 Release（完整签名）启用；Debug 与主 App 一样清空 entitlements，扩展会提示不支持。
  BillLensShareExtension:
    productName: BillLensShareExtension
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BillLensShareExtension
        excludes:
          - Info.plist
          - BillLensShareExtension.entitlements
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.BillLensApple.ShareExtension
        PRODUCT_NAME: BillLensShareExtension
        INFOPLIST_FILE: Sources/BillLensShareExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: ""
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/BillLensShareExtension/BillLensShareExtension.entitlements

  # 模拟器端到端冒烟：手动新增 / 编辑账单、订阅、资产。
  BillLensIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/BillLensIOSUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.BillLensApple.UITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        TEST_TARGET_NAME: BillLensIOSApp
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    dependencies:
      - target: BillLensIOSApp

  BillLensMacApp:
    productName: Billumi
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/BillLensMacApp
        excludes:
          - Info.plist
          - BillLensMacApp.entitlements
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.BillLensAppleMac
        PRODUCT_NAME: Billumi
        # Rust 静态库只编译宿主 arm64，Intel 切片无法链接。
        ARCHS: arm64
        INFOPLIST_FILE: Sources/BillLensMacApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/BillLensMacApp/BillLensMacApp.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/../rust/target/debug -lbilllens_ffi"
        Release:
          OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/../rust/target/release -lbilllens_ffi"
    dependencies:
      - package: BillLensApple
        product: BillLensShared
      - package: BillLensApple
        product: BillLensAppleServices
